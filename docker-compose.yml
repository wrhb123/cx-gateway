services:
  ai-proxy-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_TIME: "latest"
        GIT_COMMIT: "latest"
    container_name: ai-proxy-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SERVER_PORT=8080
      - ADMIN_PORT=8081
      - DATABASE_PATH=/app/data/proxy.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme
      # - PROXY_API_KEY=your-proxy-api-key
      # - SINGLE_PORT=true
    volumes:
      - proxy-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  proxy-data:
    driver: local
